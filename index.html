<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robook | Thư viện kỹ năng số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;600;800&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFF; --grid:#DCE8F6; --grid2:#C3D6EE;
  --tim:#5B2A86; --tim-dark:#3B1659; --tim-soft:#F1E8FA; --le:#E5484D; --hl:#FFE45C;
  --den:#17141F; --xanh:#1F9D6B; --text:#221C2E; --muted:#6B6380;
  --s0:#2F6FDE; --s1:#E0791B; --s2:#1F9D6B; --wood:#8A5A3B; --wood2:#6B4329;
  --sky:#8FD3FF; --grass:#5CC46A; --dirt:#9B6B43;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Lexend',system-ui,sans-serif;color:var(--text);background:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;min-height:100vh;
}
button,input{font:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(251,252,255,.96);border-bottom:2px solid var(--grid2)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:26px;color:var(--tim);letter-spacing:-.5px;background:none;border:0;padding:0;cursor:pointer}
.logo span{color:var(--den)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--tim);background:var(--tim-soft)}
.tab.on{color:#fff;background:var(--tim)}
.tab:focus-visible,.btn:focus-visible,.choice:focus-visible,.spine:focus-visible,.card-btn:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.lvl-chip{width:38px;height:38px;border-radius:8px;background:var(--tim);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
.xpbox{min-width:150px}
.xpbox b{display:block;font-size:14px;color:var(--tim)}
.xpbar{height:9px;border:2px solid var(--tim);border-radius:99px;background:#fff;overflow:hidden;margin:3px 0 1px}
.xpbar i{display:block;height:100%;background:var(--tim);width:0;transition:width .6s}
.xpbox small{font-size:12px;color:var(--muted)}

/* ---------- shared ---------- */
.btn{font-weight:800;font-size:18px;padding:12px 22px;border-radius:12px;cursor:pointer;border:none;background:var(--tim);color:#fff;box-shadow:0 5px 0 var(--tim-dark);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tim-dark)}
.btn.ghost{background:#fff;color:var(--tim);border:2.5px solid var(--tim);box-shadow:0 4px 0 var(--tim)}
.btn.green{background:var(--xanh);box-shadow:0 5px 0 #136748}
.btn.yellow{background:var(--hl);color:var(--den);box-shadow:0 5px 0 #C7A800}
.btn.small{font-size:15px;padding:9px 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.sec-title{font-size:28px;font-weight:800;color:var(--tim);margin:40px 0 6px;letter-spacing:-.5px}
.sec-sub{font-size:16px;color:var(--muted);margin:0 0 16px;line-height:1.5;max-width:60ch}
.panel{background:#fff;border:2.5px solid var(--den);border-radius:16px;padding:18px 20px;box-shadow:6px 6px 0 var(--grid2)}
.pill{display:inline-block;font-size:14px;font-weight:600;padding:5px 11px;border-radius:99px;border:2px solid var(--den);background:var(--paper)}
.pill.y{background:var(--hl)}
.pill.g{background:#DDF5EA;border-color:var(--xanh);color:#0F6B47}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--den);color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:80;max-width:92vw;display:none}

/* ---------- avatar + chat ---------- */
.av{display:block}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.msg{max-width:88%;}
.msg .who{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 3px 4px}
.msg .b{background:#fff;border:2px solid var(--den);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:18px;line-height:1.45}
.msg.me{align-self:flex-end}
.msg.me .who{text-align:right;margin-right:4px}
.msg.me .b{background:var(--tim);color:#fff;border-color:var(--tim);border-radius:16px 4px 16px 16px}
.msg.sys .b{background:var(--hl);border-style:dashed;border-radius:12px;font-size:16px}
.msg.warn .b{background:#FFE9E7;border-color:var(--le)}
.msg.kind .b{background:#E6F7EF;border-color:var(--xanh)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:30px;align-items:center;padding:36px 0 6px}
.hero h1{font-size:54px;line-height:1.02;letter-spacing:-2px;font-weight:800;margin:0 0 14px;color:var(--den)}
.hero h1 em{font-style:normal;color:var(--tim);display:block}
.hero p{font-size:19px;line-height:1.55;margin:0 0 18px;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.promise{font-family:'Patrick Hand',cursive;font-size:25px;line-height:1.35;color:var(--tim);margin-top:18px;max-width:30ch}
.player .row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.player h3{margin:0;font-size:20px}
.player .lv{font-size:14px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.badge{text-align:center;font-size:12px;line-height:1.3;color:var(--muted)}
.badge svg{width:52px;height:52px;display:block;margin:0 auto 4px;filter:grayscale(1);opacity:.35}
.badge.on{color:var(--den);font-weight:600}
.badge.on svg{filter:none;opacity:1}
.next-step{margin-top:14px;padding-top:12px;border-top:2px dashed var(--grid2);font-size:15px;line-height:1.5}
.next-step b{color:var(--tim)}

.shelf{margin-bottom:30px}
.shelf-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.shelf-head h3{margin:0;font-size:22px}
.shelf-head span{font-size:15px;color:var(--muted)}
.books{display:flex;align-items:flex-end;gap:12px;padding:0 16px;min-height:236px}
.board{height:16px;background:var(--wood);border-radius:3px;box-shadow:0 6px 0 var(--wood2)}
.spine{--c:var(--s0);width:70px;border:2.5px solid var(--den);border-bottom:0;border-radius:6px 6px 0 0;background:var(--c);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 0 10px;color:#fff;transition:transform .18s;box-shadow:inset -8px 0 0 rgba(0,0,0,.18)}
.spine:hover{transform:translateY(-10px)}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:15px;line-height:1.1;flex:1;display:flex;align-items:center}
.spine .band{position:absolute;left:0;right:0;top:30px;height:8px;background:rgba(255,255,255,.55)}
.spine .st{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--den);display:grid;place-items:center;font-size:13px;font-weight:800;border:2px solid var(--den);margin-top:8px}
.spine.soon{background:repeating-linear-gradient(135deg,var(--c) 0 10px,color-mix(in srgb,var(--c) 70%,#000) 10px 20px);opacity:.5}
.spine.soon:hover{transform:translateY(-4px)}
.spine.done{box-shadow:inset -8px 0 0 rgba(0,0,0,.18),0 0 0 4px var(--hl),0 0 26px 6px rgba(255,228,92,.9)}
.spine.done .st{background:var(--hl)}
.spine.sel{transform:translateY(-14px)}
.detail{margin:14px 0 4px}
.detail h4{margin:0 0 6px;font-size:23px}
.detail p{font-size:17px;line-height:1.5;margin:0 0 12px;max-width:60ch}
.detail .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.detail .acts{display:flex;gap:10px;flex-wrap:wrap}

.side3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card h3{margin:0 0 6px;font-size:20px}
.card p{font-size:15px;line-height:1.5;margin:0 0 12px;color:#3B3449}
.card .tagline{font-size:13px;font-weight:600;color:var(--le);margin-bottom:6px}
.card-btn{background:none;border:0;padding:0;color:var(--tim);font-weight:800;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lb{width:100%;border-collapse:collapse;font-size:15px}
.lb td{padding:8px 4px;border-bottom:2px solid var(--grid)}
.lb tr:last-child td{border-bottom:0}
.lb td:first-child{width:28px;font-weight:800;color:var(--tim)}
.lb td:last-child{text-align:right;font-weight:600}
.lb tr.mine{background:#FFF7C9}
.fine{font-size:12px;color:var(--muted);margin-top:6px}
.trick-more{margin-top:8px;font-size:15px;line-height:1.5}
.trick-more li{margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step .n{width:38px;height:38px;border-radius:8px;background:var(--tim);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:8px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
.step h4{margin:0 0 4px;font-size:18px}
.step p{margin:0;font-size:15px;line-height:1.5;color:#3B3449}
footer{padding:46px 0 40px;color:var(--muted);font-size:14px;line-height:1.6}

/* ---------- reader ---------- */
.rd{max-width:680px;margin:0 auto;position:relative;padding:26px 22px 130px 76px;min-height:80vh}
.rd::before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--le);opacity:.75}
.pgno{position:absolute;left:12px;top:28px;width:32px;text-align:right;font-family:'Patrick Hand';font-size:21px;color:var(--le)}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.rd h2{font-size:34px;line-height:1.12;font-weight:800;color:var(--tim);margin:0 0 16px;letter-spacing:-.5px}
.rd p{font-size:21px;line-height:1.6;margin:0 0 14px;max-width:32ch}
.rd p.big{font-size:27px;font-weight:600;line-height:1.35}
.rd p.small{font-size:17px;color:var(--muted);max-width:40ch}
.art{display:flex;gap:16px;align-items:flex-end;margin:6px 0 18px}
.art .chat{flex:1;margin:0}
.think{font-family:'Patrick Hand',cursive;font-size:24px;line-height:1.35;color:var(--tim);background:#fff;border:2px solid var(--tim);border-radius:22px;padding:12px 16px;position:relative}
.signs{list-style:none;padding:0;margin:0 0 12px}
.signs li{display:flex;gap:14px;align-items:baseline;margin-bottom:12px;font-size:19px;line-height:1.4}
.signs b{flex:0 0 104px;text-align:center;background:linear-gradient(transparent 28%,var(--hl) 28%,var(--hl) 90%,transparent 90%)}
.rule{background:var(--tim);color:#fff;border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.5;margin:6px 0 14px}
.rule b{color:var(--hl)}
.olist{counter-reset:k;list-style:none;padding:0;margin:0 0 12px}
.olist li{counter-increment:k;display:flex;gap:12px;align-items:flex-start;font-size:19px;line-height:1.45;margin-bottom:12px}
.olist li::before{content:counter(k);flex:0 0 32px;height:32px;border-radius:7px;background:var(--tim);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.cover{text-align:left}
.cover .shelfname{display:inline-block;font-size:14px;font-weight:600;color:#fff;padding:5px 11px;border-radius:99px;margin-bottom:12px}
.cover h2{font-size:44px}
.qhead{font-weight:800;color:var(--le);font-size:15px;margin-bottom:8px}
.choices{display:flex;flex-direction:column;gap:12px;margin:10px 0 14px}
.choice{font-size:18px;text-align:left;line-height:1.4;padding:13px 16px;background:#fff;color:var(--text);border:2.5px solid var(--tim);border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--tim)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tim)}
.choice.right{background:#E3F6EE;border-color:var(--xanh);box-shadow:0 4px 0 var(--xanh)}
.choice.wrong{background:#FDECEC;border-color:var(--le);box-shadow:0 4px 0 var(--le)}
.choice.picked{background:var(--hl)}
.choice[disabled]{cursor:default}
.fb{font-size:18px;line-height:1.5;padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--xanh);border-left-width:8px;margin:6px 0 12px}
.fb.bad{border-color:var(--le)}
.rd-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,252,255,.97);border-top:2px solid var(--grid2);z-index:25}
.rd-nav .in{max-width:680px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.rd-prog{flex:1;height:10px;border:2px solid var(--tim);border-radius:99px;overflow:hidden;background:#fff}
.rd-prog i{display:block;height:100%;background:var(--tim);width:0;transition:width .3s}
.page{animation:turn .3s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(16px)}}
.reward{text-align:center}
.reward p{margin-left:auto;margin-right:auto}
.codebox{display:inline-flex;align-items:center;gap:12px;background:var(--den);color:#fff;border-radius:12px;padding:12px 16px;margin:4px 0 16px}
.codebox code{font-family:'Lexend';font-weight:800;font-size:24px;letter-spacing:2px;color:var(--hl);white-space:nowrap}
.codebox button{background:#fff;color:var(--den);border:0;border-radius:8px;padding:7px 12px;font-weight:800;cursor:pointer}
.xpgain{display:inline-block;font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:30px;color:var(--xanh);margin-bottom:6px}

/* ---------- game ---------- */
.game{background:var(--sky);min-height:calc(100vh - 62px);background-image:none}
.gwrap{max-width:1040px;margin:0 auto;padding:22px 20px 40px}
.ghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ghead h1{font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:38px;line-height:1;margin:0;color:var(--den)}
.ghead p{margin:0;font-size:15px;color:#1E3A52}
.gpanel{background:#fff;border:3px solid var(--den);border-radius:6px;box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:16px}
.codein{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.codein input{border:3px solid var(--den);border-radius:6px;padding:10px 12px;font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;width:220px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.lvtile{background:#fff;border:3px solid var(--den);border-radius:6px;overflow:hidden;box-shadow:6px 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column}
.lvtile .pic{height:120px;position:relative;background:var(--sky);border-bottom:3px solid var(--den);overflow:hidden}
.lvtile .pic .ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--grass);border-top:3px solid var(--den);box-shadow:inset 0 -10px 0 var(--dirt)}
.lvtile .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.lvtile h3{font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:22px;margin:0;line-height:1.1}
.lvtile p{margin:0;font-size:14px;line-height:1.45;color:#3B3449}
.lvtile .foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvtile.locked .pic{filter:grayscale(1) brightness(.85)}
.lock-note{font-size:13px;color:var(--muted)}

.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.scene{position:relative;height:360px;background:var(--sky);border:3px solid var(--den);border-radius:6px;overflow:hidden;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.scene .cloud{position:absolute;background:#fff;border:3px solid var(--den);height:26px}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--grass);border-top:3px solid var(--den);background-image:linear-gradient(90deg,rgba(0,0,0,.08) 2px,transparent 2px);background-size:40px 100%;box-shadow:inset 0 -40px 0 var(--dirt)}
.scene .place{position:absolute;left:12px;top:10px;background:var(--den);color:#fff;font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:16px;padding:4px 10px;border-radius:4px}
.scene .actor{position:absolute;bottom:70px;text-align:center}
.scene .actor .nm{display:inline-block;background:rgba(23,20,31,.85);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:4px;white-space:nowrap}
.bubble{position:absolute;top:52px;max-width:58%;background:#fff;border:3px solid var(--den);border-radius:6px;padding:10px 12px;font-size:16px;line-height:1.4;font-weight:600}
.bubble::after{content:"";position:absolute;bottom:-14px;width:18px;height:14px;background:#fff;border:3px solid var(--den);border-top:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.bubble.r{right:16px}.bubble.r::after{right:40px}
.scene .shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.side{display:flex;flex-direction:column;gap:12px}
.timer{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.tbar{flex:1;height:16px;border:3px solid var(--den);border-radius:4px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--le);width:100%;transition:width 1s linear}
.tbar.paused i{background:#9AA7B5}
.glog{max-height:250px;overflow:auto;padding-right:4px}
.glog .chat{margin:0}
.glog .msg .b{font-size:16px}
.gchoices .choice{border-color:var(--den);box-shadow:0 4px 0 var(--den);border-radius:6px;font-size:17px}
.gchoices .choice:active{box-shadow:0 1px 0 var(--den)}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.ov{background:#fff;border:3px solid var(--den);border-radius:8px;max-width:520px;width:100%;padding:22px;box-shadow:8px 8px 0 rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.ov h3{font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:28px;margin:0 0 10px;line-height:1.1}
.ov p{font-size:17px;line-height:1.5;margin:0 0 12px}
.chain{list-style:none;padding:0;margin:0 0 14px}
.chain li{font-size:16px;line-height:1.4;padding:9px 12px;margin-bottom:7px;background:var(--den);color:#fff;border-radius:6px;opacity:0;animation:in .4s forwards}
.chain li:nth-child(2){animation-delay:.5s}.chain li:nth-child(3){animation-delay:1s}.chain li:nth-child(4){animation-delay:1.5s}
@keyframes in{to{opacity:1}}
.why{background:var(--hl);border-radius:6px;padding:10px 12px;font-size:16px;line-height:1.5;margin-bottom:14px}
.pausering{width:130px;height:130px;margin:6px auto 10px;position:relative}
.pausering svg{width:100%;height:100%;transform:rotate(-90deg)}
.pausering span{position:absolute;inset:0;display:grid;place-items:center;font-family:'Baloo 2','Lexend',sans-serif;font-weight:800;font-size:50px;color:var(--tim)}
.pq{text-align:center;font-weight:600;font-size:20px;color:var(--tim);min-height:58px}
.win{text-align:center}
.win svg.bigbadge{width:120px;margin:0 auto 8px;display:block}

/* ---------- boss ---------- */
.boss-chat .msg{cursor:pointer;max-width:100%}
.boss-chat .msg .b{transition:background .2s}
.boss-chat .msg.flagged .b{background:#FFE9E7;border-color:var(--le)}
.boss-chat .msg.flagged .who::after{content:"  Đã đánh dấu giả";color:var(--le)}
.boss-chat .msg.res-ok .b{box-shadow:0 0 0 3px var(--xanh)}
.boss-chat .msg.res-bad .b{box-shadow:0 0 0 3px var(--le)}
.boss-chat .note{font-size:14px;line-height:1.45;margin:4px 0 0 4px;color:#3B3449}
.boss-hp{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.boss-hp .tbar i{background:var(--le)}

/* ---------- talk + parents ---------- */
.narrow{max-width:760px;margin:0 auto;padding:30px 20px 60px}
.narrow h1{font-size:40px;line-height:1.05;letter-spacing:-1px;margin:0 0 10px;color:var(--den)}
.narrow .lead{font-size:18px;line-height:1.55;margin:0 0 20px;max-width:56ch}

const KEY='robook-v3';
let S={xp:0,books:[],codes:[],levels:[],boss:false,quizBest:{},used:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function addXP(n){S.xp+=n;save();renderMe()}
function rankIdx(){let r=0;RANKS.forEach((x,i)=>{if(S.xp>=x[1])r=i});return r}
function badgeOn(b){return b.id==='b3'?S.boss:(S.books.includes(b.book)&&S.levels.includes(b.lv))}
function renderMe(){
  const r=rankIdx(),nx=RANKS[r+1],lo=RANKS[r][1];
  $('#rankName').textContent=RANKS[r][0];$('#lvlChip').textContent=r+1;
  $('#xpBar').style.width=(nx?((S.xp-lo)/(nx[1]-lo)*100):100)+'%';
  $('#xpTxt').textContent=nx?`${S.xp} / ${nx[1]} XP`:`${S.xp} XP`;
}

let view='home';
function go(v,arg){
  stopTimer();closeOv();
  view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===v));
  const sky=(v==='game'||v==='play');document.body.style.background=sky?'var(--sky)':'';document.body.style.backgroundImage=sky?'none':'';
  ({home:renderHome,read:renderReader,game:renderGame,play:renderPlay,boss:renderBoss,talk:renderTalk,parents:renderParents})[v](arg);
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

let R=null;
function renderReader(id){
  const b=BOOKS.find(x=>x.id===id),c=CONTENT[id];
  R={b,c,i:0,ans:{},first:{}};
  app.innerHTML=`<div class="rd" id="rd"></div><nav class="rd-nav"><div class="in"><button class="btn ghost small" id="rBack">Trước</button><div class="rd-prog"><i id="rProg"></i></div><button class="btn small" id="rNext">Lật trang</button></div></nav>`;
  $('#rNext').onclick=()=>{if(!$('#rNext').disabled){R.i++;drawPage()}};
  $('#rBack').onclick=()=>{if(R.i===0)go('home');else{R.i--;drawPage()}};
  drawPage();
}
function drawPage(){
  const {b,c}=R,P=c.pages.length,Q=c.quiz.length,total=P+Q+1,sh=SHELVES[b.shelf];
  let locked=false,html='';
  if(R.i<P){html=`<div class="crumb">${sh.name} · ${b.t}</div>`+c.pages[R.i]()}
  else if(R.i<P+Q){
    const qi=R.i-P,q=c.quiz[qi],done=R.ans[qi];
    html=`<div class="crumb">${sh.name} · ${b.t}</div><div class="qhead">Kiểm tra nhanh · Câu ${qi+1}/${Q}</div><h2>${q.q}</h2>
      <div class="choices">${q.o.map((o,i)=>`<button class="choice" data-i="${i}" ${done?'disabled':''}>${o[0]}</button>`).join('')}</div><div id="qfb">${done?`<div class="fb">${q.ok}</div>`:''}</div>`;
    locked=!done;
  } else html=rewardHTML();
  $('#rd').innerHTML=`<div class="pgno">${R.i+1}</div><div class="page">${html}</div>`;
  if(R.i>=P&&R.i<P+Q){
    const qi=R.i-P,q=c.quiz[qi];
    if(R.ans[qi]) document.querySelectorAll('.choice').forEach(x=>{if(q.o[x.dataset.i][1])x.classList.add('right')});
    else document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
      const ok=q.o[btn.dataset.i][1]===1;
      if(R.first[qi]===undefined)R.first[qi]=ok;
      if(ok){R.ans[qi]=true;document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;x.classList.remove('wrong')});btn.classList.add('right');$('#qfb').innerHTML=`<div class="fb">${q.ok}</div>`;$('#rNext').disabled=false}
      else{btn.classList.add('wrong');btn.disabled=true;$('#qfb').innerHTML=`<div class="fb bad">${q.no} Chọn lại nhé.</div>`}
    });
  }
  if(R.i===total-1) bindReward();
  const last=R.i===total-1;
  $('#rBack').textContent=R.i===0?'Thư viện':'Trước';
  $('#rNext').style.visibility=last?'hidden':'visible';
  $('#rNext').disabled=locked;
  $('#rNext').textContent=R.i===P-1?'Làm bài kiểm tra':(R.i===P+Q-1?'Nhận thưởng':(R.i>=P?'Câu tiếp':'Lật trang'));
  $('#rProg').style.width=(R.i/(total-1)*100)+'%';
  window.scrollTo(0,0);
}
function rewardHTML(){
  const {b,c}=R,Q=c.quiz.length,right=Object.values(R.first).filter(Boolean).length,first=!S.books.includes(b.id);
  const gain=40+right*20;
  if(first){S.books.push(b.id);if(!S.codes.includes(b.code))S.codes.push(b.code);S.quizBest[b.id]=right;addXP(gain)}
  else{S.quizBest[b.id]=Math.max(S.quizBest[b.id]||0,right);save()}
  const lv=LEVELS[b.level];
  return `<div class="reward"><h2>Đọc xong rồi!</h2>
    ${first?`<div class="xpgain">+${gain} XP</div>`:''}
    <p>Con trả lời đúng ngay lần đầu <b>${right}/${Q}</b> câu.${right<Q?' Câu nào sai đã có giải thích, con đọc lại khi cần nhé.':''}</p>
    <p class="small">Mã mở màn chơi <b>${lv.name}</b> ở Đảo Khối:</p>
    <div class="codebox"><code>${b.code}</code><button id="copyCode">Sao chép</button></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn yellow" id="toPlay">Vào màn chơi</button><button class="btn ghost" id="toLib">Về thư viện</button></div></div>`;
}
function bindReward(){
  $('#copyCode').onclick=async function(){try{await navigator.clipboard.writeText(R.b.code);this.textContent='Đã chép'}catch(e){this.textContent='Chép tay nhé'}};
  $('#toPlay').onclick=()=>go('play',R.b.level);
  $('#toLib').onclick=()=>{selBook=R.b.id;go('home')};
}

let G=null,timerH=null;
function stopTimer(){clearInterval(timerH);timerH=null}
function renderPlay(id){
  const l=LEVELS[id];
  G={id,l,r:0,firstTry:[],paused:false,usedPause:false,left:0,log:[]};
  app.innerHTML=`<div class="gwrap">
   <div class="ghead"><button class="btn small ghost" id="gBack">Đảo Khối</button><h1>${l.name}</h1></div>
   <div class="stage">
    <div class="scene" id="scene">
      <div class="cloud" style="left:40px;top:44px;width:90px"></div><div class="cloud" style="right:60px;top:70px;width:120px"></div>

      <div class="ground"></div>
      <div class="actor" style="left:9%"><span class="nm">Con</span><br>${who(l.hero,{size:120})}</div>
      <div class="actor" id="npcA" style="right:9%"><span class="nm">${l.npc.n}</span><br>${who(l.npc.k,{size:120})}</div>
      <div class="bubble r" id="bubble" style="display:none"></div>
    </div>
    <div class="side">
      <div class="gpanel"><div class="timer"><span>Thời gian</span><div class="tbar" id="tbar"><i id="tfill"></i></div><span id="tnum">0</span></div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn small" id="pauseBtn">Dừng 10 giây</button><span class="lock-note" id="roundLbl"></span></div></div>
      <div class="gpanel glog" id="glog"><div class="chat" id="gchat"></div></div>
      <div class="gchoices choices" id="gch"></div>
    </div>
   </div></div>`;
  $('#gBack').onclick=()=>go('game');
  $('#pauseBtn').onclick=openPause;
  startRound();
}
function logMsg(m){G.log.push(m);$('#gchat').insertAdjacentHTML('beforeend',`<div class="msg ${m.c||''}"><div class="who">${m.n}</div><div class="b">${m.t}</div></div>`);const g=$('#glog');g.scrollTop=g.scrollHeight;
  if(!m.c||m.c==='kind'){$('#bubble').textContent=m.t;$('#bubble').style.display='block'}}
function startRound(){
  const rd=G.l.rounds[G.r];
  $('#roundLbl').textContent=`Lượt ${G.r+1}/${G.l.rounds.length}`;
  rd.msgs.forEach((m,i)=>setTimeout(()=>{if(view==='play')logMsg(m)},i*600));
  setTimeout(()=>{if(view!=='play')return;drawChoices();runTimer(rd.t)},rd.msgs.length*600);
}
function drawChoices(){
  const rd=G.l.rounds[G.r];
  $('#gch').innerHTML=rd.ch.map((c,i)=>`<button class="choice" data-c="${i}">${c.t}</button>`).join('');
  document.querySelectorAll('#gch .choice').forEach(b=>b.onclick=()=>pick(+b.dataset.c));
}
function runTimer(sec){
  stopTimer();G.left=sec;G.total=sec;G.expired=false;updT();
  timerH=setInterval(()=>{if(G.paused)return;G.left--;updT();
    if(G.left<=0){stopTimer();G.expired=true;
      logMsg({n:'Robook',c:'sys',t:'Hết giờ rồi? Không sao cả. Đồng hồ đếm ngược chỉ để con vội. Cứ bình tĩnh chọn.'});
      setTimeout(()=>{if(view==='play'&&G.l.npc.k==='scam')logMsg({n:G.l.npc.n,t:'Mình gia hạn thêm cho bạn 5 phút nữa nè, nhanh lên nha!'})},700);
    }},1000);
}
function updT(){$('#tnum').textContent=Math.max(0,G.left)+'s';$('#tfill').style.width=(Math.max(0,G.left)/G.total*100)+'%'}
function pick(i){
  const rd=G.l.rounds[G.r],c=rd.ch[i];
  if(G.firstTry[G.r]===undefined)G.firstTry[G.r]=!!c.ok;
  if(!c.ok){
    stopTimer();
    $('#npcA').classList.remove('shake');void $('#npcA').offsetWidth;$('#npcA').classList.add('shake');
    showOv(`<h3>Chuyện gì xảy ra tiếp...</h3><ul class="chain">${c.chain.map(x=>`<li>${x}</li>`).join('')}</ul><div class="why"><b>Vì sao không an toàn:</b> ${c.why}</div><p>Đây chỉ là mô phỏng, chưa có gì mất thật. Con thử lại lượt này nhé.</p><button class="btn" id="retry">Thử lại lượt này</button>`);
    $('#retry').onclick=()=>{closeOv();document.querySelector(`#gch [data-c="${i}"]`).disabled=true;runTimer(rd.t)};
    return;
  }
  stopTimer();
  document.querySelectorAll('#gch .choice').forEach(b=>b.disabled=true);
  document.querySelector(`#gch [data-c="${i}"]`).classList.add('right');
  logMsg({n:'Con',c:'me',t:c.t.replace(/^“|”$/g,'')});
  setTimeout(()=>{logMsg(c.reply);
    const last=G.r===G.l.rounds.length-1;
    $('#gch').insertAdjacentHTML('beforeend',`<button class="btn yellow" id="nextR">${last?'Hoàn thành màn':'Lượt tiếp theo'}</button>`);
    $('#nextR').onclick=()=>{if(last)winLevel();else{G.r++;$('#gch').innerHTML='';startRound()}};
  },500);
}
function openPause(){
  if(G.paused)return;G.paused=true;$('#tbar').classList.add('paused');
  const qs=['Ai đang muốn mình làm gì?','Sao lại gấp thế?','Mình kiểm chứng bằng cách nào?'];
  showOv(`<h3>Dừng 10 giây</h3><div class="pausering"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#DCE8F6" stroke-width="9"/><circle id="parc" cx="50" cy="50" r="44" fill="none" stroke="#5B2A86" stroke-width="9" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><span id="pnum">10</span></div><div class="pq" id="pq">${qs[0]}</div><div style="text-align:center"><button class="btn" id="pDone" disabled>Quay lại</button></div>`);
  let s=10;const h=setInterval(()=>{s--;$('#pnum').textContent=s;$('#parc').style.strokeDashoffset=276.5*(1-s/10);
    if(s===7)$('#pq').textContent=qs[1];if(s===4)$('#pq').textContent=qs[2];
    if(s<=0){clearInterval(h);$('#pq').textContent='Đầu đã bắt kịp tay. Giờ chọn nhé!';$('#pDone').disabled=false;G.usedPause=true}},1000);
  G.pauseH=h;
  $('#pDone').onclick=()=>{closeOv();G.paused=false;$('#tbar').classList.remove('paused')};
}
function winLevel(){
  const l=G.l,first=!S.levels.includes(G.id),good=G.firstTry.filter(Boolean).length;
  const gain=60+good*20+(G.usedPause?20:0);
  if(first){S.levels.push(G.id);addXP(gain)}
  const b=BOOKS.find(x=>x.id===l.book),bd=BADGES.find(x=>x.book===l.book),got=badgeOn(bd);
  showOv(`<div class="win">${got?`<svg class="bigbadge" viewBox="0 0 60 60">${BADGE_SVG(bd.fill,GLYPH[bd.g]).replace(/<\/?svg[^>]*>/g,'')}</svg>`:''}
    <h3>Qua màn “${l.name}”!</h3>${first?`<div class="xpgain">+${gain} XP</div>`:''}
    <p>Chọn đúng ngay lần đầu: <b>${good}/${l.rounds.length}</b> lượt.${G.usedPause?' Thưởng thêm vì con đã dùng “Dừng 10 giây”.':''}</p>
    ${got?`<p>Con nhận huy hiệu <b>${bd.name}</b> vì đã làm chủ ${SHELVES[b.shelf].name}.</p>`:''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn yellow" id="wHub">Về Đảo Khối</button><button class="btn ghost" id="wLib">Về thư viện</button></div></div>`);
  $('#wHub').onclick=()=>go('game');$('#wLib').onclick=()=>go('home');
}
function showOv(h){$('#ovBody').innerHTML=h;$('#ov').classList.add('show');const f=$('#ovBody').querySelector('button:not([disabled])');if(f)f.focus()}
function closeOv(){$('#ov').classList.remove('show');if(G&&G.pauseH)clearInterval(G.pauseH)}

   <div id="bres" style="margin-top:16px"></div></div>`;
  document.querySelectorAll('#bchat .msg').forEach(el=>{const t=()=>{if(el.dataset.lock)return;const i=+el.dataset.m;flagged.has(i)?flagged.delete(i):flagged.add(i);el.classList.toggle('flagged');el.setAttribute('aria-pressed',flagged.has(i))};
    el.onclick=t;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
  $('#bReset').onclick=renderBoss;
  $('#attack').onclick=function(){
    let right=0;
    BOSS.msgs.forEach((m,i)=>{const el=document.querySelector(`[data-m="${i}"]`),ok=(flagged.has(i)===!!m.fake);if(ok)right++;
      el.dataset.lock=1;el.classList.add(ok?'res-ok':'res-bad');el.insertAdjacentHTML('beforeend',`<div class="note"><b>${m.fake?'Tin giả':'Tin thật'}.</b> ${m.why}</div>`)});
    $('#bossHp').style.width=(100-right/BOSS.msgs.length*100)+'%';
    const win=right>=5,first=win&&!S.boss;
    if(first){S.boss=true;addXP(right*10)}
    this.disabled=true;
    $('#bres').innerHTML=`<div class="fb ${win?'':'bad'}">${win?`Hạ boss! Con soi đúng ${right}/6 tin.${first?` Nhận <b>+${right*10} XP</b> cho hội và huy hiệu <b>Thợ Săn Boss</b>.`:''}`:`Con soi đúng ${right}/6 tin. Boss còn máu! Đọc giải thích bên trên rồi bấm Làm lại nhé.`}</div>`;
  };
}

/* =========================================================
   TALK (Kênh kể lại an toàn)
   ========================================================= */
function renderTalk(){
  app.innerHTML=`<div class="narrow">
   <h1>Kể lại</h1>
   <p class="safe-msg">Bạn không gặp rắc rối khi kể ra. Chúng ta sẽ cùng tìm cách giải quyết.</p>
   <div class="panel" id="talkBox"></div>
   <p class="priv">Robook không lưu những gì con chọn ở đây. Báo cáo gửi phụ huynh không hiển thị nội dung này.</p></div>`;
  talkStep1();
}
function talkStep1(){
  $('#talkBox').innerHTML=`<div class="talkstep">Bước 1/3</div><h2 style="margin:0 0 12px;font-size:24px">Chuyện gì đã xảy ra?</h2>
   <div class="sitgrid">${SITS.map(s=>`<button class="sit" data-s="${s.id}"><b>${s.t}</b>${s.d}</button>`).join('')}</div>`;
  document.querySelectorAll('.sit').forEach(b=>b.onclick=()=>talkStep2(SITS.find(s=>s.id===b.dataset.s)));
}
function talkStep2(s){
  const a={};
  $('#talkBox').innerHTML=`<div class="talkstep">Bước 2/3</div><h2 style="margin:0 0 6px;font-size:24px">${s.t}</h2><p style="margin:0 0 14px;color:var(--muted)">Trả lời 2 câu ngắn để Robook gợi ý đúng hơn.</p>
   <b>Chuyện xảy ra khi nào?</b><div class="choices" id="qa1"><button class="choice" data-v="now">Vừa xong</button><button class="choice" data-v="day">Hôm qua hoặc vài hôm trước</button><button class="choice" data-v="long">Lâu rồi</button></div>
   <b>Đã có người lớn nào biết chưa?</b><div class="choices" id="qa2"><button class="choice" data-v="no">Chưa ai biết</button><button class="choice" data-v="yes">Có người lớn biết rồi</button></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost small" id="tBack">Quay lại</button><button class="btn" id="tNext" disabled>Xem cách xử lý</button></div>`;
  ['qa1','qa2'].forEach(k=>document.querySelectorAll(`#${k} .choice`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${k} .choice`).forEach(x=>x.classList.remove('picked'));b.classList.add('picked');a[k]=b.dataset.v;$('#tNext').disabled=!(a.qa1&&a.qa2)}));
  $('#tBack').onclick=talkStep1;$('#tNext').onclick=()=>talkStep3(s,a);
}
function talkStep3(s,a){
  $('#talkBox').innerHTML=`<div class="talkstep">Bước 3/3</div><h2 style="margin:0 0 12px;font-size:24px">Mình làm thế này nhé</h2>
   ${a.qa1==='now'?'<div class="fb">Con kể rất kịp thời. Xử lý càng sớm, càng ít thiệt hại.</div>':'<div class="fb">Dù đã qua một thời gian, kể ra bây giờ vẫn giúp được rất nhiều.</div>'}
   <ul class="olist" style="margin-top:14px">${s.steps.map(x=>`<li style="font-size:17px">${x}</li>`).join('')}</ul>
   ${a.qa2==='no'?`<h3 style="margin:18px 0 8px;font-size:19px">Kể với người lớn thế nào?</h3><p style="margin:0 0 6px">Chọn một người con tin: bố, mẹ, ông bà, anh chị, thầy cô. Con có thể mở lời thế này:</p>${chat([{n:'Con',c:'me',t:'Con lỡ gặp chuyện trên mạng. Con hơi sợ, mình nghe con kể hết trước được không?'}])}`:'<div class="fb">Tốt lắm! Có người lớn cùng xử lý thì con không phải lo một mình.</div>'}
   <div class="hotline"><div class="num">111</div><p><b>Tổng đài quốc gia bảo vệ trẻ em.</b> Gọi miễn phí, hoạt động cả ngày lẫn đêm. Dùng khi con bị đe dọa, bị bắt nạt nghiêm trọng, hoặc không biết kể với ai.</p></div>
   <button class="btn ghost small" id="tAgain">Kể chuyện khác</button>`;
  $('#tAgain').onclick=talkStep1;
}

/* =========================================================
   PARENTS
   ========================================================= */
function renderParents(){
  const rows=SHELVES.map((s,si)=>{
    const b=BOOKS.find(x=>x.shelf===si&&x.ready),read=S.books.includes(b.id),lv=S.levels.includes(b.level),q=S.quizBest[b.id]||0;
    let st,txt;
    if(read&&lv){st='<span class="st ok">Đã làm chủ</span>';txt={0:'Con đã từ chối đưa mật khẩu và mã OTP trong tình huống mô phỏng có người hứa “cày thuê miễn phí”.',1:'Con đã kiểm tra nguồn chính thức thay vì bấm link nhận quà, và hỏi lại bạn bằng kênh khác khi acc bạn có dấu hiệu bị chiếm.',2:'Con đã chọn kể với người lớn khi mất acc, tránh dịch vụ lấy lại acc lừa đảo và cảnh báo bạn bè.'}[si]}
    else if(read){st='<span class="st mid">Đang học</span>';txt=`Con đã đọc “${b.t}” (đúng ${q}/3 câu ngay lần đầu). Bước tiếp theo là thực hành ở màn chơi tương ứng.`}
    else{st='<span class="st">Chưa bắt đầu</span>';txt=`Con chưa đọc cuốn “${b.t}”.`}
    return `<tr><td><b>${s.name.replace('Kệ ','')}</b><br><span style="color:var(--muted);font-size:13px">${s.sub}</span></td><td>${st}</td><td>${txt}</td></tr>`}).join('');
  app.innerHTML=`<div class="narrow">
   <h1>Dành cho phụ huynh</h1>
   <p class="lead">Robook trang bị cho con những kỹ năng mà chính chúng ta chưa từng được dạy khi lớn lên. Trang này giúp anh chị theo dõi con đã làm được gì, và đồng hành đúng cách khi con gặp sự cố.</p>
   <h2 class="h2s">Báo cáo kỹ năng của con</h2>
   <table class="rep"><tr><th>Nhóm kỹ năng</th><th>Mức độ</th><th>Nhận xét</th></tr>${rows}</table>
   <p class="priv">Báo cáo chỉ thể hiện kết quả học tập. Những gì con chia sẻ trong mục Kể lại không được lưu và không hiển thị ở đây.</p>
   <h2 class="h2s">Bộ hướng dẫn đồng hành</h2>
   <ol class="guide">
    <li><div><b>Khi con kể: cảm ơn trước, sửa sau.</b>Câu đầu tiên con cần nghe là “Cảm ơn con đã kể với bố mẹ”. Trách mắng ngay lúc đó khiến lần sau con chọn im lặng.</div></li>
    <li><div><b>Không tịch thu điện thoại vì con đã nói thật.</b>Nếu nói thật bị phạt, con sẽ học cách giấu. Hãy tách chuyện xử lý sự cố khỏi chuyện kỷ luật.</div></li>
    <li><div><b>Đặt một câu mật mã gia đình.</b>Một câu hỏi chỉ người trong nhà biết, dùng để xác minh khi có cuộc gọi hoặc tin nhắn đáng ngờ nhân danh người thân.</div></li>
    <li><div><b>Hướng dẫn con lưu bằng chứng.</b>Chụp màn hình tin nhắn, tên tài khoản, đường link trước khi chặn hoặc báo cáo.</div></li>
    <li><div><b>Biết nơi tìm trợ giúp.</b>Trang hỗ trợ chính thức của từng game, và Tổng đài quốc gia bảo vệ trẻ em 111 (miễn phí, 24/7) khi cần hỗ trợ bảo vệ trẻ.</div></li>
   </ol>
   <h2 class="h2s">Cam kết bảo vệ dữ liệu</h2>
   <ul class="promise-list">
    <li>Con dùng nickname. Robook không hỏi tên thật, ảnh, số điện thoại hay trường học.</li>
    <li>Không bao giờ yêu cầu mật khẩu thật. Mọi tình huống nhập thông tin đều là mô phỏng.</li>
    <li>Chỉ thu thập dữ liệu cần cho việc học, và nói rõ mục đích sử dụng.</li>
    <li>Dữ liệu tiến độ học tập tách biệt hoàn toàn với nội dung con chia sẻ trong mục Kể lại.</li>
    <li>Nội dung được rà soát và cập nhật định kỳ qua chuyên mục “Trò lừa tháng này”.</li>
   </ul></div>`;
}

/* ========================================================= */
$('#ov').onclick=e=>{if(e.target.id==='ov'&&!$('#ovBody').querySelector('#pDone'))closeOv()};
renderMe();go('home');
</script>
